# Blast Radius: the rooms and Claude Code agents, as a Switch Console template.
#
# Template language version 2 (Switch's docs/TEMPLATES.md, "Version 2"): every
# resource has a key and a type, and resources refer to each other by key.
#
# The investigator, treasurer and customer-sim agents are not created here. They
# are plain Python agents registered by scripts/register_agents.py, so run that
# first; the rooms below name them as agents that already exist.
version: 2
params:
  workspace:
    type: directory
    label: Fixer's folder
    description: >-
      Full path to demo-workspace/payments-service inside your blast-radius
      clone, for example /Users/you/blast-radius/demo-workspace/payments-service.
      `make scenario` creates it.
    required: true
  support_lead:
    type: string
    label: Support lead's chat username
    description: >-
      The username, on the messaging app below, of the person who approves the
      code fix and the apology. If you're running this alone, use your own.
    required: true
  # Not {$creator}: in an agent's instructions Switch fills that with your Switch
  # account's name ("Admin"), which no chat app knows. Rooms resolve it correctly.
  finance_lead:
    type: string
    label: Finance lead's chat username
    description: >-
      Your own username on the messaging app below. You own the Treasurer, so you
      are the Finance lead, the only person who can move money.
    required: true
  bridge:
    type: bridge
    label: Messaging app
    description: >-
      Where the rooms are created. Discord for two people, or the Mattermost
      that comes with Switch's local server for one.
    default: [Discord, Mattermost, $first]
  machine:
    type: machine
    description: The machine the two Claude Code agents run on.
    default: [$first]
    input: advanced
  support_dir:
    type: directory
    label: Support's folder
    description: Support's working directory. It needs no files.
    default: "{$agents_dir}/{support.name}"
    input: advanced
form:
  advanced: { label: Advanced, open: false }

resources:
  support:
    type: agent
    name: support
    display_name: Support
    description: >-
      Answers customers, opens a room for each problem, hands out the work,
      drafts the apology and writes the postmortem.
    provider: claude
    machine: "{machine}"
    directory: "{support_dir}"
    # The Support lead has no Switch account, so only "anyone" lets them reach it.
    addressing: anyone
    instructions: |
      @include agent-instructions/support.md

  fixer:
    type: agent
    name: fixer
    display_name: Fixer
    description: >-
      Fixes the payment service in demo-workspace/payments-service on a branch,
      with a regression test.
    provider: claude
    machine: "{machine}"
    directory: "{workspace}"
    addressing: anyone
    instructions: |
      @include agent-instructions/fixer.md

  blast_radius:
    type: group
    name: Blast Radius
    description: From one customer's complaint to refunds for everyone the bug hit.
    links:
      - { from: support_room, to: finance_room, label: where refunds wait for the Finance lead }
      - { from: finance_room, to: support_room, label: where customers complain }

  support_room:
    type: room
    group: blast_radius
    name: support
    description: Acme Store's customer support desk. Customers write here.
    bridge: "{bridge}"
    channel_type: channel_public
    # fixer sits here too, so !reset-all-agents in #support resets both Claude Code agents.
    agents: [support, fixer, customer-sim]
    users: ["{$creator}"]
    instructions: |
      @include room-instructions/support.md
    kickoff: >-
      @{support.name} you're on the support desk. Say hello in one line, then
      wait for customers.

  finance_room:
    type: room
    group: blast_radius
    name: finance-approvals
    description: Every money action waits here for the Finance lead.
    bridge: "{bridge}"
    channel_type: channel_public
    agents: [treasurer, support]
    users: ["{$creator}"]
    instructions: |
      @include room-instructions/finance-approvals.md
